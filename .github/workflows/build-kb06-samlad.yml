name: Bygg KB06-samlad

on:
  push:
    branches:
      - main
    paths:
      - "1. Syfte/**"
      - "2. Jämförelse/**"
      - "3. Ramar/**"
      - "4. Nyttor och kostnader/**"
      - "5. Värdering/**"
      - "6. Osäkerhet/**"
      - "7. Sammanfattning/**"
      - "Referensanalyser/**"
      - "Valfritt stöd och fördjupning/**"
      - "scripts/build_kb06_samlad.py"
      - ".github/workflows/build-kb06-samlad.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-kb06-samlad
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bygg samlingsfilen
        run: python scripts/build_kb06_samlad.py

      - name: Spara uppdaterad samlingsfil
        run: |
          if git diff --quiet -- KB06-samlad.md; then
            echo "KB06-samlad.md är redan aktuell."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KB06-samlad.md
          git commit -m "Uppdatera KB06-samlad.md"
          git push
